<style>
:root{color-scheme:dark;--ink:#17201b;--cream:#f3e8cd;--orange:#f5a64a;--mint:#9ed6a3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a17;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--cream);touch-action:none}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#32372c,#171a17 74%)}#frame{position:relative;width:min(100vw,142.857vh);height:min(100vh,70vw);aspect-ratio:10/7;max-width:1280px;max-height:896px;overflow:hidden;border:1px solid #62543b;border-radius:12px;background:#222820;box-shadow:0 24px 90px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}.brand{position:absolute;left:20px;top:17px;font-size:10px;font-weight:900;letter-spacing:.22em;color:#d4c7a6;pointer-events:none;text-shadow:0 2px #17201b}.sound{position:absolute;right:17px;top:14px;border:1px solid #867652;background:#282c25;color:#f1dfb8;border-radius:99px;padding:8px 12px;font:800 10px inherit;letter-spacing:.12em;cursor:pointer;z-index:3}.touch-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#c5b99c;font-size:9px;letter-spacing:.1em;opacity:.72;pointer-events:none}.mobile-label{display:none}@media(max-width:700px){#frame{width:100vw;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;border:0;border-radius:0}.brand{top:calc(env(safe-area-inset-top) + 10px);left:14px;font-size:9px}.sound{top:calc(env(safe-area-inset-top) + 8px);right:12px;padding:7px 10px}.touch-hint{bottom:calc(env(safe-area-inset-bottom) + 7px);font-size:8px}.mobile-label{display:block}}#turn-note{display:none}@media(max-width:700px) and (orientation:portrait){#frame{position:absolute;left:50%;top:50%;width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}#turn-note{display:block;position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);white-space:nowrap;border:1px solid #827351;border-radius:20px;background:#1a1e19e8;color:#f0dfb8;padding:9px 14px;font-size:10px;font-weight:900;letter-spacing:.08em}}

<body><main id="frame"><canvas id="game" aria-label="Gutter Run game"></canvas><div class="brand">✦ GUTTER RUN <span style="color:#f5a64a">/</span> AFTER-HOURS SALVAGE</div><button class="sound" id="sound">♫ SOUND: OFF</button><div class="touch-hint">WASD / ARROWS · AIM + CLICK OR SPACE TO FIRE <span class="mobile-label"> · LEFT THUMB MOVE / RIGHT THUMB AIM + FIRE</span></div></main><div id="turn-note">↻ &nbsp; ROTATE YOUR PHONE FOR THE FULL LANDSCAPE RUN</div>
<script>
(() => {
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),frame=document.querySelector('#frame');
const W=1000,H=700; let scale=1,scaleX=1,scaleY=1,ox=0,oy=0,last=0, state='title', room=1, maxRooms=4, shake=0, soundOn=false;
const keys={}, pointer={x:500,y:350,down:false}, touches=new Map(), sticks={move:null,aim:null};let audioCtx=null;function blip(freq=420,duration=.06){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(_){}}
let player,enemies=[],shots=[],foeShots=[],particles=[],loot=[],deco=[],door=null,roomClock=0,toast='',toastTime=0,runStats={scrap:0,kills:0};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(frame.offsetWidth*d);canvas.height=Math.round(frame.offsetHeight*d);scaleX=canvas.width/W;scaleY=canvas.height/H;scale=Math.min(scaleX,scaleY);ox=0;oy=0;ctx.setTransform(scaleX,0,0,scaleY,ox,oy)}window.addEventListener('resize',resize);resize();
function pos(e){const d=Math.min(devicePixelRatio||1,2);let lx,ly;if(matchMedia('(max-width:700px) and (orientation:portrait)').matches){const r=frame.getBoundingClientRect();lx=e.clientY-r.top+frame.offsetWidth/2-r.height/2;ly=r.width/2-(e.clientX-r.left)+frame.offsetHeight/2-r.width/2}else{const r=frame.getBoundingClientRect();lx=e.clientX-r.left;ly=e.clientY-r.top}return{x:clamp(lx*d/scaleX,0,W),y:clamp(ly*d/scaleY,0,H)}}
function setToast(t){toast=t;toastTime=2.2}
function startGame(){state='play';room=1;runStats={scrap:0,kills:0};player={x:500,y:370,r:17,hp:5,maxHp:5,speed:210,fireRate:.32,fire:0,damage:1,range:470,inv:0,aimX:1,aimY:0,items:[],trail:[]};newRoom();}
function newRoom(){enemies=[];shots=[];foeShots=[];particles=[];loot=[];door=null;roomClock=0;deco=[];for(let i=0;i<24;i++)deco.push({x:rand(105,895),y:rand(105,595),r:rand(3,10),type:Math.floor(rand(0,4)),rot:rand(0,6.28)});player.x=500;player.y=370;
 if(room===maxRooms){enemies.push(makeEnemy('boss',500,205));setToast('THE LANDFILL KING · big trouble');}
 else {const count=2+room*2;for(let i=0;i<count;i++){let x,y;do{x=rand(170,830);y=rand(145,555)}while(Math.hypot(x-500,y-370)<150);enemies.push(makeEnemy(i%4===3?'spitter':'scrapling',x,y));}}
}
function makeEnemy(type,x,y){const boss=type==='boss';return{x,y,r:boss?38:type==='spitter'?18:15,type,hp:boss?18:type==='spitter'?3:2,maxHp:boss?18:type==='spitter'?3:2,speed:boss?48:type==='spitter'?45:72,fire:rand(.8,2),phase:rand(0,6),hit:0}}
function addParticles(x,y,color,n=8,power=100){for(let i=0;i<n;i++){let a=rand(0,6.28),s=rand(power*.25,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7),max:.7,color,r:rand(2,5)})}}
function spawnLoot(x,y){const list=[['SOCK FULL OF BOLTS','+1 damage','damage'],['ENERGY DRINK TAB','+18% fire rate','rate'],['SHOPPING CART WHEEL','+12% speed','speed'],['MYSTERY CAN','+1 heart','heart'],['GLOW STICK','shots pierce farther','range']];let it=list[Math.floor(Math.random()*list.length)];loot.push({x,y,r:15,name:it[0],desc:it[1],kind:it[2],bob:0});}
function applyLoot(item){if(item.kind==='damage')player.damage+=1;if(item.kind==='rate')player.fireRate*=.82;if(item.kind==='speed')player.speed*=1.12;if(item.kind==='heart'){player.maxHp++;player.hp=Math.min(player.maxHp,player.hp+1)}if(item.kind==='range')player.range+=150;player.items.push(item.name);setToast(item.name+'  ·  '+item.desc);addParticles(player.x,player.y,'#f8c56d',18,140)}
function advanceRoom(){room++;if(room>maxRooms){state='win';return}newRoom();setToast(room===maxRooms?'FINAL ROOM · THE KING WAITS':'ROOM '+String(room).padStart(2,'0')+' · KEEP SCAVENGING')}
function fireShot(x,y,vx,vy,owner='player',damage=1){(owner==='player'?shots:foeShots).push({x,y,vx,vy,r:owner==='player'?5:6,life:owner==='player'?1.5:4,damage,owner});}
function update(dt){if(state!=='play')return;roomClock+=dt;player.fire=Math.max(0,player.fire-dt);player.inv=Math.max(0,player.inv-dt);if(toastTime>0)toastTime-=dt;shake=Math.max(0,shake-dt*20);
 let mx=0,my=0;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
 if(sticks.move){mx=sticks.move.dx;my=sticks.move.dy}let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}player.x=clamp(player.x+mx*player.speed*dt,78,922);player.y=clamp(player.y+my*player.speed*dt,95,605);
 let ax=pointer.x-player.x,ay=pointer.y-player.y,al=Math.hypot(ax,ay)||1;let firing=pointer.down||keys.Space||keys.KeyJ;
 if(sticks.aim){ax=sticks.aim.dx;ay=sticks.aim.dy;al=Math.hypot(ax,ay)||1;if(al>.18)firing=true}if(Math.hypot(ax,ay)>5){player.aimX=ax/al;player.aimY=ay/al}
 if(!firing&&enemies.length){let near=enemies.reduce((p,e)=>dist(player,e)<dist(player,p)?e:p,enemies[0]);ax=near.x-player.x;ay=near.y-player.y;al=Math.hypot(ax,ay)||1;player.aimX=ax/al;player.aimY=ay/al}
 if(firing&&player.fire<=0){fireShot(player.x+player.aimX*17,player.y+player.aimY*17,player.aimX*490,player.aimY*490);blip(260,.045);player.fire=player.fireRate;addParticles(player.x+player.aimX*18,player.y+player.aimY*18,'#f7d27b',2,45)}
 for(const e of enemies){e.phase+=dt;e.hit=Math.max(0,e.hit-dt);let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(e.type==='spitter'||e.type==='boss'){if(d>220){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}else if(d<155){e.x-=dx/d*e.speed*dt*.7;e.y-=dy/d*e.speed*dt*.7}e.fire-=dt;if(e.fire<=0){let a=Math.atan2(dy,dx);if(e.type==='boss'){for(let j=-1;j<=1;j++)fireShot(e.x,e.y,Math.cos(a+j*.32)*170,Math.sin(a+j*.32)*170,'enemy',1);e.fire=1.35}else{fireShot(e.x,e.y,dx/d*190,dy/d*190,'enemy',1);e.fire=2.2}}}else{e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}}
 for(const b of shots){if(!b.life)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp-=b.damage;e.hit=.12;b.life=0;addParticles(b.x,b.y,'#f7d27b',4,80);if(e.hp<=0){runStats.kills++;addParticles(e.x,e.y,e.type==='boss'?'#f2a94f':'#a5cf8c',18,160);if(Math.random()<.30||e.type==='boss')spawnLoot(e.x,e.y)}break}}}
 for(const b of foeShots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life>0&&player.inv<=0&&Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r){b.life=0;hurtPlayer()}}
 for(const e of enemies){if(e.hp>0&&player.inv<=0&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r-2)hurtPlayer()}
 shots=shots.filter(b=>b.life>0&&b.x>55&&b.x<945&&b.y>70&&b.y<630);foeShots=foeShots.filter(b=>b.life>0&&b.x>50&&b.x<950&&b.y>60&&b.y<640);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt});particles=particles.filter(p=>p.life>0);
 loot.forEach(it=>{it.bob+=dt*3;if(Math.hypot(player.x-it.x,player.y-it.y)<player.r+it.r+4){applyLoot(it);it.got=true}});loot=loot.filter(it=>!it.got);
 enemies=enemies.filter(e=>e.hp>0);
 if(!enemies.length&&!door){door={x:500,y:86};if(loot.length===0)spawnLoot(500,350);setToast('ROOM CLEAR · grab the junk, find the exit')}
 if(door&&Math.hypot(player.x-door.x,player.y-door.y)<38&&loot.length===0)advanceRoom();
 if(player.hp<=0)state='dead';}
function hurtPlayer(){player.hp--;player.inv=1.15;shake=8;blip(110,.2);addParticles(player.x,player.y,'#ff8366',14,150);setToast('OW! keep your paws up');}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function text(t,x,y,size,color='#f3e8cd',align='left',weight=700){ctx.font=`${weight} ${size}px ui-rounded, Trebuchet MS, system-ui, sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function drawBackground(){ctx.fillStyle='#252a23';ctx.fillRect(0,0,W,H);ctx.fillStyle='#292e26';ctx.fillRect(70,70,860,560);
 // worn floor tiles
 for(let y=78;y<630;y+=56)for(let x=78;x<930;x+=56){ctx.strokeStyle=((x+y)/56%2<1)?'#30352b':'#2d3229';ctx.lineWidth=1;ctx.strokeRect(x,y,56,56)}
 // subtle floor stains
 for(const d of deco){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.globalAlpha=.35;ctx.fillStyle=['#454331','#4b3b2e','#394235','#514537'][d.type];ctx.beginPath();ctx.ellipse(0,0,d.r*1.6,d.r*.8,0,0,Math.PI*2);ctx.fill();ctx.restore()}
 // perimeter walls + rivets
 ctx.fillStyle='#4b4d3b';ctx.fillRect(56,56,888,19);ctx.fillRect(56,625,888,19);ctx.fillRect(56,56,19,588);ctx.fillRect(925,56,19,588);ctx.fillStyle='#686448';ctx.fillRect(64,65,872,4);ctx.fillRect(64,631,872,4);
 for(let x=88;x<925;x+=42){ctx.fillStyle='#252820';ctx.beginPath();ctx.arc(x,65,2,0,7);ctx.fill();ctx.beginPath();ctx.arc(x,635,2,0,7);ctx.fill()}for(let y=95;y<625;y+=42){ctx.beginPath();ctx.arc(65,y,2,0,7);ctx.fill();ctx.beginPath();ctx.arc(935,y,2,0,7);ctx.fill()}
 // room stamp
 text('DUMPSTER DISTRICT   /   '+String(room).padStart(2,'0'),82,91,9,'#817d5e','left',800);
}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(player.aimY,player.aimX));if(player.inv>0&&Math.floor(player.inv*14)%2)ctx.globalAlpha=.4;
 // tail
 ctx.fillStyle='#a88e6f';ctx.beginPath();ctx.ellipse(-18,10,20,9,-.35,0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++){ctx.strokeStyle=i%2?'#574b40':'#d0b18a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-31+i*7,4+i*2);ctx.lineTo(-29+i*7,15+i*1.2);ctx.stroke()}
 // body and ears
 ctx.fillStyle='#60594b';ctx.beginPath();ctx.ellipse(0,1,16,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#60594b';ctx.beginPath();ctx.arc(5,-9,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-2,-15,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(11,-15,5,0,Math.PI*2);ctx.fill();
 // mask
 ctx.fillStyle='#252522';ctx.beginPath();ctx.ellipse(8,-9,9,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7d8b8';ctx.beginPath();ctx.arc(8,-9,1.8,0,7);ctx.arc(14,-9,1.8,0,7);ctx.fill();ctx.fillStyle='#28251f';ctx.beginPath();ctx.arc(17,-4,2,0,7);ctx.fill();
 // bandana + blaster
 ctx.fillStyle='#e07842';ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(5,9);ctx.lineTo(0,15);ctx.closePath();ctx.fill();ctx.fillStyle='#aaa58a';rr(12,-2,18,8,2,'#aaa58a','#514f42');ctx.fillStyle='#e0b862';ctx.fillRect(25,0,6,3);ctx.restore();
}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(e.phase*2)*.08);if(e.hit>0)ctx.globalAlpha=.6;const boss=e.type==='boss';if(boss){ctx.fillStyle='#704c35';ctx.beginPath();ctx.ellipse(0,2,37,35,0,0,7);ctx.fill();ctx.fillStyle='#906748';ctx.beginPath();ctx.arc(0,-14,22,0,7);ctx.fill();ctx.fillStyle='#d5a255';ctx.fillRect(-28,-26,13,6);ctx.fillRect(15,-26,13,6);ctx.fillStyle='#211f1a';ctx.beginPath();ctx.ellipse(0,-11,15,7,0,0,7);ctx.fill();ctx.fillStyle='#efaa57';ctx.fillRect(-10,-13,4,4);ctx.fillRect(7,-13,4,4);ctx.fillStyle='#b88d61';ctx.fillRect(-12,23,24,12);ctx.fillStyle='#38372d';ctx.fillRect(-16,30,32,8);text('KING',0,-44,9,'#f7d27b','center',900)}else{ctx.fillStyle=e.type==='spitter'?'#77785c':'#8c7557';ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.fillStyle='#595547';ctx.beginPath();ctx.arc(-5,-6,5,0,7);ctx.arc(7,-6,5,0,7);ctx.fill();ctx.fillStyle='#f0bd70';ctx.fillRect(-7,-7,2,2);ctx.fillRect(5,-7,2,2);ctx.fillStyle='#30312a';ctx.beginPath();ctx.arc(0,2,3,0,7);ctx.fill();ctx.fillStyle='#c2a579';ctx.fillRect(-e.r,-e.r-7,e.r*2,3);ctx.fillStyle='#df7955';ctx.fillRect(-e.r,-e.r-7,e.r*2*(e.hp/e.maxHp),3)}ctx.restore()}
function drawLoot(it){const yy=it.y+Math.sin(it.bob)*4;ctx.save();ctx.translate(it.x,yy);ctx.shadowColor='#f7c96d';ctx.shadowBlur=15;ctx.fillStyle='#ecc56f';ctx.beginPath();ctx.arc(0,0,it.r+3,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#494838';ctx.beginPath();ctx.arc(0,0,it.r,0,7);ctx.fill();ctx.fillStyle='#e3b862';ctx.save();ctx.rotate(Math.sin(it.bob*.7)*.15);ctx.fillRect(-6,-8,12,16);ctx.fillStyle='#3b3b30';ctx.fillRect(-3,-4,6,7);ctx.restore();ctx.restore();if(Math.hypot(player.x-it.x,player.y-it.y)<75){rr(it.x-97,yy-43,194,30,8,'#20241eeF','#94835a');text(it.name,it.x,yy-32,9,'#f8e6bf','center',900);text(it.desc,it.x,yy-19,9,'#a9d8a1','center',700)}}
function drawDoor(){if(!door)return;ctx.save();ctx.translate(door.x,door.y);ctx.fillStyle='#171b17';ctx.beginPath();ctx.ellipse(0,0,29,17,0,0,7);ctx.fill();ctx.strokeStyle='#e0b65f';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,27,15,0,0,7);ctx.stroke();text('EXIT',0,0,8,'#f4d184','center',900);ctx.restore()}
function drawBullets(){for(const b of shots){ctx.fillStyle='#ffe18b';ctx.shadowColor='#f2b84f';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}ctx.shadowBlur=0;for(const b of foeShots){ctx.fillStyle='#ec8261';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function drawHUD(){rr(78,105,844,52,13,'#1c211ddd','#58543d');text('HP',96,131,9,'#b7ac8e','left',900);for(let i=0;i<player.maxHp;i++){ctx.fillStyle=i<player.hp?'#e77c5e':'#53483c';ctx.beginPath();ctx.arc(128+i*21,131,7,0,7);ctx.fill();ctx.fillStyle=i<player.hp?'#f4b27c':'#71604c';ctx.beginPath();ctx.arc(128+i*21,129,4,0,7);ctx.fill()}
 text('ROOM',270,124,8,'#a69b7c','left',900);text(`${String(room).padStart(2,'0')} / 04`,270,139,13,'#f1e4c5','left',900);text('SCRAP',370,124,8,'#a69b7c','left',900);text(String(runStats.kills).padStart(2,'0'),370,139,13,'#f1e4c5','left',900);
 let shown=player.items.slice(-3);text('JUNK LOADOUT',490,124,8,'#a69b7c','left',900);if(shown.length)text(shown.map(x=>x.split(' ')[0]).join(' · '),490,139,10,'#b5d3a2','left',800);else text('nothing but grit',490,139,10,'#827c65','left',600);
 text(room===maxRooms?'BOSS ROOM':'CLEAR THE ROOM',892,131,9,room===maxRooms?'#e9ad67':'#c8d1ad','right',900);
 const boss=enemies.find(e=>e.type==='boss');if(boss){rr(365,624,270,12,6,'#1d211c','#756248');rr(368,627,264*(boss.hp/boss.maxHp),6,4,'#ce704d');text('THE LANDFILL KING',500,613,8,'#e6c690','center',900)}
 if(toastTime>0){ctx.globalAlpha=Math.min(1,toastTime*2);rr(278,173,444,34,11,'#1c211ee8','#5f5a43');text(toast,500,190,10,'#f2dfb6','center',900);ctx.globalAlpha=1}
}
function drawTitle(){ctx.fillStyle='#171b17b8';ctx.fillRect(0,0,W,H); // spotlight
